name: Polyfill Connectors Gate CI

on:
  pull_request:
    branches: [main]

jobs:
  Polyfill Connectors Gate:
    name: Polyfill Connectors Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for drift trigger
        run: |
          if [ -f drift-trigger.txt ]; then
            echo "Simulated drift finding detected (drift-trigger.txt present)"
            exit 1
          fi
          echo "No drift detected"
